an fill="#986801">T</tspan><tspan fill="#24292f">] == </tspan><tspan fill="#986801">0</tspan></text><text x="70" y="517" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">85</text><text x="110" y="517" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    wei = wei.</tspan><tspan fill="#4078f2">masked_fill</tspan><tspan fill="#24292f">(mask, </tspan><tspan fill="#4078f2">float</tspan><tspan fill="#24292f">(</tspan><tspan fill="#50a14f">&#x27;-inf&#x27;</tspan><tspan fill="#24292f">))</tspan></text><text x="70" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">86</text><text x="110" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    wei = </tspan><tspan fill="#986801">F</tspan><tspan fill="#24292f">.</tspan><tspan fill="#4078f2">softmax</tspan><tspan fill="#24292f">(wei, dim=-</tspan><tspan fill="#986801">1</tspan><tspan fill="#24292f">)</tspan></text><text x="70" y="605" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">87</text><text x="110" y="605" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"></text><text x="70" y="649" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">88</text><text x="110" y="649" font-family="JetBrains Mono, Menlo, monospace" font-size="29" fill="#a0a1a7" font-style="italic" xml:space="preserve">    # weighted sum of the values</text><text x="70" y="693" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">89</text><text x="110" y="693" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    v = </tspan><tspan fill="#a626a4">self</tspan><tspan fill="#24292f">.</tspan><tspan fill="#4078f2">value</tspan><tspan fill="#24292f">(x)</tspan></text><text x="70" y="737" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">90</text><text x="110" y="737" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    </tspan><tspan fill="#a626a4">return</tspan><tspan fill="#24292f"> wei @ v</tspan></text></svg>
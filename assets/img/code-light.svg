<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#ffffff"/><rect width="100%" height="62" fill="#ececec"/><circle cx="34" cy="31" r="8" fill="#ff5f57"/><circle cx="60" cy="31" r="8" fill="#febc2e"/><circle cx="86" cy="31" r="8" fill="#28c840"/><text x="600.0" y="38" font-family="JetBrains Mono, Menlo, monospace" font-size="19" text-anchor="middle" fill="#6e7781">gpt.py</text><text x="70" y="121" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">76</text><text x="110" y="121" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#a626a4">def</tspan><tspan fill="#24292f"> </tspan><tspan fill="#4078f2">forward</tspan><tspan fill="#24292f">(</tspan><tspan fill="#a626a4">self</tspan><tspan fill="#24292f">, x):</tspan></text><text x="70" y="165" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">77</text><text x="110" y="165" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    </tspan><tspan fill="#986801">B</tspan><tspan fill="#24292f">, </tspan><tspan fill="#986801">T</tspan><tspan fill="#24292f">, </tspan><tspan fill="#986801">C</tspan><tspan fill="#24292f"> = x.shape</tspan></text><text x="70" y="209" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">78</text><text x="110" y="209" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#24292f">    k = </tspan><tspan fill="#a626a4">self</tspan><tspan fill="#24292f">.</tspan><tspan fill="#4078f2">key</tspan><tspan fill="#24292f">(x)</tspan></text><text x="70" y="253" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#b1b6bd">79</text><text x="110" y="253" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><
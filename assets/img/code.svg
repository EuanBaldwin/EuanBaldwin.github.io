<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#f4f4f3"/><text x="80" y="68.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#566C6C">def</tspan><tspan fill="#111111"> forward(</tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">, x):</tspan></text><text x="80" y="116.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    B, T, C = x.shape</tspan></text><text x="80" y="164.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    k = </tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">.key(x)</tspan></text><text x="80" y="212.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    q = </tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">.query(x)</tspan></text><text x="80" y="260.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"></text><text x="80" y="308.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" fill="#8a8a8a" xml:space="preserve">    # affinity between tokens</text><text x="80" y="356.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    wei = q @ k.transpose(-1, -2)</tspan></text><text x="80" y="404.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    wei = wei * </tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">.head_size ** -0.5</tspan></text><text x="80" y="452.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    mask = </tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">.tril[:T, :T] == 0</tspan></text><text x="80" y="500.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    wei = wei.masked_fill(mask, </tspan><tspan fill="#566C6C">float</tspan><tspan fill="#111111">(&#x27;-inf&#x27;))</tspan></text><text x="80" y="548.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    wei = F.softmax(wei, dim=-1)</tspan></text><text x="80" y="596.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"></text><text x="80" y="644.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" fill="#8a8a8a" xml:space="preserve">    # weighted sum of the values</text><text x="80" y="692.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    v = </tspan><tspan fill="#566C6C">self</tspan><tspan fill="#111111">.value(x)</tspan></text><text x="80" y="740.0" font-family="JetBrains Mono, Menlo, monospace" font-size="34" xml:space="preserve"><tspan fill="#111111">    </tspan><tspan fill="#566C6C">return</tspan><tspan fill="#111111"> wei @ v</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#f4f4f3"/><rect x="70" y="50" width="1060" height="700" rx="14" fill="#1c2128"/><path d="M70 64 a14 14 0 0 1 14 -14 h1032 a14 14 0 0 1 14 14 v42 h-1060 z" fill="#161b22"/><circle cx="98" cy="78" r="7" fill="#ff5f57"/><circle cx="122" cy="78" r="7" fill="#febc2e"/><circle cx="146" cy="78" r="7" fill="#28c840"/><text x="600.0" y="85" font-family="JetBrains Mono, Menlo, monospace" font-size="17" text-anchor="middle" fill="#9ca3af">gpt.py</text><text x="126" y="132" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">76</text><text x="162" y="132" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#c678dd">def</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#61afef">forward</tspan><tspan fill="#e6e6e6">(</tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">, x):</tspan></text><text x="126" y="171" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">77</text><text x="162" y="171" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    </tspan><tspan fill="#d19a66">B</tspan><tspan fill="#e6e6e6">, </tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">, </tspan><tspan fill="#d19a66">C</tspan><tspan fill="#e6e6e6"> = x.shape</tspan></text><text x="126" y="210" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">78</text><text x="162" y="210" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    k = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">key</tspan><tspan fill="#e6e6e6">(x)</tspan></text><text x="126" y="249" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">79</text><text x="162" y="249" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    q = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">query</tspan><tspan fill="#e6e6e6">(x)</tspan></text><text x="126" y="288" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">80</text><text x="162" y="288" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"></text><text x="126" y="327" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">81</text><text x="162" y="327" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#6b7280" font-style="italic" xml:space="preserve">    # affinity between tokens</text><text x="126" y="366" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">82</text><text x="162" y="366" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    wei = q @ k.</tspan><tspan fill="#61afef">transpose</tspan><tspan fill="#e6e6e6">(-</tspan><tspan fill="#d19a66">1</tspan><tspan fill="#e6e6e6">, -</tspan><tspan fill="#d19a66">2</tspan><tspan fill="#e6e6e6">)</tspan></text><text x="126" y="405" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">83</text><text x="162" y="405" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    wei = wei * </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.head_size ** -</tspan><tspan fill="#d19a66">0.5</tspan></text><text x="126" y="444" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">84</text><text x="162" y="444" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    mask = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.tril[:</tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">, :</tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">] == </tspan><tspan fill="#d19a66">0</tspan></text><text x="126" y="483" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">85</text><text x="162" y="483" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    wei = wei.</tspan><tspan fill="#61afef">masked_fill</tspan><tspan fill="#e6e6e6">(mask, </tspan><tspan fill="#61afef">float</tspan><tspan fill="#e6e6e6">(</tspan><tspan fill="#98c379">&#x27;-inf&#x27;</tspan><tspan fill="#e6e6e6">))</tspan></text><text x="126" y="522" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">86</text><text x="162" y="522" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    wei = </tspan><tspan fill="#d19a66">F</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">softmax</tspan><tspan fill="#e6e6e6">(wei, dim=-</tspan><tspan fill="#d19a66">1</tspan><tspan fill="#e6e6e6">)</tspan></text><text x="126" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">87</text><text x="162" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"></text><text x="126" y="600" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">88</text><text x="162" y="600" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#6b7280" font-style="italic" xml:space="preserve">    # weighted sum of the values</text><text x="126" y="639" font-family="JetBrains Mono, Menlo, monospace" font-size="22" text-anchor="end" fill="#4b5563">89</text><text x="162" y="639" font-family="JetBrains Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#e6e6e6">    v = </tspan><tspa
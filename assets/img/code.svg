<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#1c2128"/><rect width="100%" height="62" fill="#161b22"/><circle cx="34" cy="31" r="8" fill="#ff5f57"/><circle cx="60" cy="31" r="8" fill="#febc2e"/><circle cx="86" cy="31" r="8" fill="#28c840"/><text x="600.0" y="38" font-family="JetBrains Mono, Menlo, monospace" font-size="19" text-anchor="middle" fill="#9ca3af">gpt.py</text><text x="70" y="121" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">76</text><text x="110" y="121" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#c678dd">def</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#61afef">forward</tspan><tspan fill="#e6e6e6">(</tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">, x):</tspan></text><text x="70" y="165" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">77</text><text x="110" y="165" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    </tspan><tspan fill="#d19a66">B</tspan><tspan fill="#e6e6e6">, </tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">, </tspan><tspan fill="#d19a66">C</tspan><tspan fill="#e6e6e6"> = x.shape</tspan></text><text x="70" y="209" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">78</text><text x="110" y="209" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    k = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">key</tspan><tspan fill="#e6e6e6">(x)</tspan></text><text x="70" y="253" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">79</text><text x="110" y="253" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    q = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">query</tspan><tspan fill="#e6e6e6">(x)</tspan></text><text x="70" y="297" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">80</text><text x="110" y="297" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"></text><text x="70" y="341" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">81</text><text x="110" y="341" font-family="JetBrains Mono, Menlo, monospace" font-size="29" fill="#6b7280" font-style="italic" xml:space="preserve">    # affinity between tokens</text><text x="70" y="385" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">82</text><text x="110" y="385" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    wei = q @ k.</tspan><tspan fill="#61afef">transpose</tspan><tspan fill="#e6e6e6">(-</tspan><tspan fill="#d19a66">1</tspan><tspan fill="#e6e6e6">, -</tspan><tspan fill="#d19a66">2</tspan><tspan fill="#e6e6e6">)</tspan></text><text x="70" y="429" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">83</text><text x="110" y="429" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    wei = wei * </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.head_size ** -</tspan><tspan fill="#d19a66">0.5</tspan></text><text x="70" y="473" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">84</text><text x="110" y="473" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    mask = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.tril[:</tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">, :</tspan><tspan fill="#d19a66">T</tspan><tspan fill="#e6e6e6">] == </tspan><tspan fill="#d19a66">0</tspan></text><text x="70" y="517" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">85</text><text x="110" y="517" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    wei = wei.</tspan><tspan fill="#61afef">masked_fill</tspan><tspan fill="#e6e6e6">(mask, </tspan><tspan fill="#61afef">float</tspan><tspan fill="#e6e6e6">(</tspan><tspan fill="#98c379">&#x27;-inf&#x27;</tspan><tspan fill="#e6e6e6">))</tspan></text><text x="70" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">86</text><text x="110" y="561" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    wei = </tspan><tspan fill="#d19a66">F</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">softmax</tspan><tspan fill="#e6e6e6">(wei, dim=-</tspan><tspan fill="#d19a66">1</tspan><tspan fill="#e6e6e6">)</tspan></text><text x="70" y="605" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">87</text><text x="110" y="605" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"></text><text x="70" y="649" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">88</text><text x="110" y="649" font-family="JetBrains Mono, Menlo, monospace" font-size="29" fill="#6b7280" font-style="italic" xml:space="preserve">    # weighted sum of the values</text><text x="70" y="693" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">89</text><text x="110" y="693" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    v = </tspan><tspan fill="#c678dd">self</tspan><tspan fill="#e6e6e6">.</tspan><tspan fill="#61afef">value</tspan><tspan fill="#e6e6e6">(x)</tspan></text><text x="70" y="737" font-family="JetBrains Mono, Menlo, monospace" font-size="24" text-anchor="end" fill="#4b5563">90</text><text x="110" y="737" font-family="JetBrains Mono, Menlo, monospace" font-size="29" xml:space="preserve"><tspan fill="#e6e6e6">    </tspan><tspan fill="#c678dd">return</tspan><tspan fill="#e6e6e6"> wei @ v</tspan></text></svg>